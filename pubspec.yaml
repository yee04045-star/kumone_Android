name: kumone_flutter
publish_to: "none"
version: 0.7.5+65

description: Unofficial Flutter Android behavioral port of Kumone with liquid glass UI and user-configurable audio sources.

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  liquid_glass_easy:
    path: packages/liquid_glass_easy
  cupertino_icons: 1.0.8
  dio: 5.11.1
  pointycastle: 4.0.0
  crypto: 3.0.6
  flutter_cache_manager: ^3.4.1
  cached_network_image: 4.0.0
  just_audio: 0.10.6
  audio_service: 0.18.19
  audio_session: 0.2.4
  flutter_secure_storage: 11.1.0
  shared_preferences: 2.5.5
  qr_flutter: 4.1.0
  url_launcher: 6.3.2
  provider: 6.1.5+1
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.2.1
  jp_transliterate: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  shared_preferences_platform_interface: 2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icons/
