name: Android APK (Release)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: '选择 APK 架构（大多数现代手机选 ARM64）'
        required: true
        default: ARM64
        type: choice
        options:
          - ARM64
          - ARMV7
          - X86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Prepare Android wrapper
        run: bash scripts/prepare_android.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Gradle cache/parallelism
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.daemon=true
          org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
          EOF

      - name: Resolve packages
        run: flutter pub get

      - name: Patch just_audio with optional direct USB engine
        run: bash scripts/patch_just_audio_usb.sh

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build selected architecture
        env:
          APK_ARCH: ${{ inputs.architecture }}
        run: |
          case "$APK_ARCH" in
            ARM64) target=android-arm64; abi=arm64-v8a ;;
            ARMV7) target=android-arm; abi=armeabi-v7a ;;
            X86_64) target=android-x64; abi=x86_64 ;;
            *) echo "Unsupported architecture: $APK_ARCH" >&2; exit 1 ;;
          esac
          flutter build apk --release --target-platform "$target" --split-per-abi
          mkdir -p dist
          cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/kumone-${abi}-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kumone-android-${{ inputs.architecture }}
          path: dist/*.apk
          if-no-files-found: error
